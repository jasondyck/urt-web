# Browser Urban Terror, self-hosted: open http://<host>:8080
#   docker compose up -d --build
# The first build downloads UrT 4.3.4 (1.4 GB) and compiles the engine; later
# builds reuse the cache. Maps: server/mapcycle.txt (rebuild after changing it).
services:
  urt-web:
    build: .
    image: urt-web
    restart: unless-stopped
    environment:
      URT_DEDICATED: "1"   # always-on server in the lobby; "0" = browser-hosted games only
      URT_P2P: "1"         # players can host games in their browser; "0" = dedicated server only
      # ICE servers for browser-hosted games. The default public STUN helps across
      # NATs; on a LAN or VPN where players reach each other directly, "[]" keeps
      # everything local. Add your own TURN server here if some players can't connect.
      # URT_ICE_SERVERS: '[{"urls":"stun:stun.cloudflare.com:3478"}]'
    volumes:
      # game settings; edit and `docker compose restart`
      - ./server/server.cfg:/home/nonroot/q3ut4/server.cfg:ro
    ports:
      - "${URT_HTTP_PORT:-8080}:8080"
      - "${URT_UDP_PORT:-27960}:27960/udp"   # optional: lets installed UrT clients join the dedicated server
