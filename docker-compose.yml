# Browser Urban Terror: the gateway serves the site on :8080 and relays browser
# packets to the stock UrT server. Run ./setup.sh once before `docker compose up -d`.
services:
  server:
    image: debian:12-slim
    restart: unless-stopped
    user: "65534:65534"
    entrypoint: ["/entrypoint.sh"]
    environment:
      HOME: /home/urt   # the UrT binary creates ~/.q3a even with fs_homepath set
    volumes:
      - ./data/UrbanTerror43:/urt:ro
      - ./server/entrypoint.sh:/entrypoint.sh:ro
      - ./server/server.cfg:/home/urt/q3ut4/server.cfg:ro
      - ./server/mapcycle.txt:/home/urt/q3ut4/mapcycle.txt:ro
    tmpfs:
      - /home/urt:uid=65534,gid=65534
    networks:
      urt:
        ipv4_address: 172.31.27.10
    ports:
      - "${URT_UDP_PORT:-27960}:27960/udp"   # optional: lets installed UrT clients join the same game

  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      URT_SERVERS: 172.31.27.10:27960
    volumes:
      - ./dist:/web:ro
    networks:
      urt:
    ports:
      - "${URT_HTTP_PORT:-8080}:8080"
    depends_on:
      - server

networks:
  urt:
    ipam:
      config:
        - subnet: 172.31.27.0/24
