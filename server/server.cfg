// urt-web test server
set sv_hostname "urt-web"
set sv_maxclients 12
set sv_pure 0
set auth_enable 0
set sv_strictauth 0
set g_gametype 11         // 0 FFA, 3 TDM, 4 TS, 7 CTF, 11 Gun game
set timelimit 15
set fraglimit 0
set sv_master1 ""
set sv_master2 ""
set sv_master3 ""
set sv_master4 ""
set sv_master5 ""
set g_followstrict 0
set g_mapcycle "mapcycle.txt"
set sv_clientsPerIp 64   // every browser player arrives from the gateway IP
