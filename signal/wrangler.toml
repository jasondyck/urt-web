# Matchmaking for browser-hosted games. Deploy: npx wrangler deploy
# Optional secrets (TURN relay for players behind strict NATs):
#   npx wrangler secret put TURN_KEY_ID
#   npx wrangler secret put TURN_KEY_API_TOKEN
name = "urt-signal"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
# comma-separated page origins allowed to connect, e.g. "https://jasondyck.github.io"; empty allows any
ALLOWED_ORIGINS = ""

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Directory"]
